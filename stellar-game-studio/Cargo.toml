[workspace]
resolver = "2"
members = [
  "contracts/mock-game-hub",
  "contracts/twenty-one",
  "contracts/number-guess",
  "contracts/dice-duel",
  "contracts/guitar-pizza",
  "contracts/pizza-recipe",
  "contracts/zk-leaderboard",
  "contracts/daily-recipe",
  "contracts/achievement-vault",
]

[workspace.dependencies]
soroban-sdk = "25.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 16
lto = false
